<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1180 640" width="1180" height="640" role="img" aria-label="AI_Net architecture: the observer's observation at t and t-1 and their difference are partitioned into per-agent slices; each slice plus the self/global block is routed to a Directional Social Awareness module shared per agent-type pair, the self/global block alone goes to a Directional Self Awareness module, and the module outputs are concatenated into the predicted joint action vector that feeds the actor." font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52514e"/>
    </marker>
    <marker id="arB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#2a78d6"/>
    </marker>
    <marker id="arO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#eb6834"/>
    </marker>
  </defs>

  <rect width="1180" height="640" fill="#fcfcfb"/>
  <text x="30" y="34" fill="#0b0b0b" font-size="16" font-weight="700">AI_Net: how observer agent i estimates the joint action vector â<tspan font-size="11" dy="4">i</tspan></text>
  <text x="30" y="52" fill="#52514e">One forward pass, for a single observer i. Blue = information about another agent k. Orange = the observer's own state and global context.</text>

  <!-- ================= 1. Temporal stack ================= -->
  <text x="40" y="88" fill="#0b0b0b" font-weight="600">1 · Temporal stack of observer i's observation</text>

  <!-- column headers -->
  <text x="90" y="112" text-anchor="middle" fill="#0b0b0b" font-weight="600">o<tspan font-size="9" dy="3">t</tspan></text>
  <text x="180" y="112" text-anchor="middle" fill="#0b0b0b" font-weight="600">o<tspan font-size="9" dy="3">t−1</tspan></text>
  <text x="270" y="112" text-anchor="middle" fill="#0b0b0b" font-weight="600">Δo = o<tspan font-size="9" dy="3">t</tspan><tspan dy="-3"> − o</tspan><tspan font-size="9" dy="3">t−1</tspan></text>
  <text x="270" y="126" text-anchor="middle" fill="#898781" font-size="10">computed, not observed</text>

  <!-- three columns, same row partition -->
  <g id="colA">
    <rect x="50" y="132" width="80" height="34" fill="#cde2fb" stroke="#86b6ef"/>
    <rect x="50" y="166" width="80" height="34" fill="#cde2fb" stroke="#86b6ef"/>
    <rect x="50" y="200" width="80" height="34" fill="#9ec5f4" stroke="#2a78d6" stroke-width="1.5"/>
    <rect x="50" y="234" width="80" height="34" fill="#cde2fb" stroke="#86b6ef"/>
    <rect x="50" y="276" width="80" height="60" fill="#fde3d7" stroke="#eb6834"/>
  </g>
  <use href="#colA" x="90"/>
  <use href="#colA" x="180"/>

  <!-- row labels inside first column -->
  <g fill="#0b0b0b" font-size="11" text-anchor="middle">
    <text x="90" y="153">agent 1 slice</text>
    <text x="90" y="187">agent 2 slice</text>
    <text x="90" y="221" font-weight="600">agent k slice</text>
    <text x="90" y="255">agent N slice</text>
    <text x="90" y="300">self + global</text>
    <text x="90" y="314" font-size="10" fill="#52514e">own vel, own pos,</text>
    <text x="90" y="326" font-size="10" fill="#52514e">landmarks</text>
  </g>
  <text x="180" y="221" text-anchor="middle" fill="#0b0b0b" font-size="11">k</text>
  <text x="270" y="221" text-anchor="middle" fill="#0b0b0b" font-size="11">Δk</text>
  <text x="180" y="300" text-anchor="middle" fill="#0b0b0b" font-size="11">self + global</text>
  <text x="270" y="300" text-anchor="middle" fill="#0b0b0b" font-size="11">Δ self + global</text>

  <!-- ellipsis hint between 2 and k, k and N -->
  <text x="40" y="353" fill="#52514e" font-size="11">Rows = one slice per other agent (relative position, and velocity if visible), plus the observer's own block.</text>
  <text x="40" y="369" fill="#52514e" font-size="11">The split is fixed by a sub-assignment key: each observation index maps to an agent id, or to −1 for self/global.</text>

  <!-- ================= 2. Bundles ================= -->
  <text x="400" y="88" fill="#0b0b0b" font-weight="600">2 · Route into bundles</text>

  <!-- social bundle for agent k -->
  <rect x="400" y="150" width="190" height="104" rx="6" fill="#ffffff" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="495" y="170" text-anchor="middle" fill="#2a78d6" font-weight="600">bundle(i → k)</text>
  <text x="495" y="188" text-anchor="middle" fill="#0b0b0b" font-size="11">[ slice k , self+global ]</text>
  <text x="495" y="204" text-anchor="middle" fill="#0b0b0b" font-size="11">at t, at t−1, and Δ</text>
  <text x="495" y="226" text-anchor="middle" fill="#52514e" font-size="11">length 3 · ( |slice k| + |self+global| )</text>
  <text x="495" y="244" text-anchor="middle" fill="#898781" font-size="10">one bundle per other agent k ≠ i</text>
  <!-- faded duplicates behind to suggest N-1 bundles -->
  <rect x="408" y="142" width="190" height="104" rx="6" fill="none" stroke="#c3c2b7" stroke-dasharray="3 3"/>
  <rect x="416" y="134" width="190" height="104" rx="6" fill="none" stroke="#e1e0d9" stroke-dasharray="3 3"/>

  <!-- self bundle -->
  <rect x="400" y="282" width="190" height="74" rx="6" fill="#ffffff" stroke="#eb6834" stroke-width="1.5"/>
  <text x="495" y="302" text-anchor="middle" fill="#eb6834" font-weight="600">bundle(i → i)</text>
  <text x="495" y="320" text-anchor="middle" fill="#0b0b0b" font-size="11">[ self+global ] at t, t−1, Δ</text>
  <text x="495" y="340" text-anchor="middle" fill="#52514e" font-size="11">length 3 · |self+global|</text>

  <!-- routing lines: agent-k rows (3 cols) -> social bundle -->
  <path d="M310,217 L398,190" fill="none" stroke="#2a78d6" stroke-width="1.5" marker-end="url(#arB)"/>
  <path d="M310,306 L398,214" fill="none" stroke="#eb6834" stroke-width="1.5" marker-end="url(#arO)"/>
  <!-- self rows -> self bundle -->
  <path d="M310,316 L398,318" fill="none" stroke="#eb6834" stroke-width="1.5" marker-end="url(#arO)"/>
  <text x="352" y="180" text-anchor="middle" fill="#2a78d6" font-size="10">row k, all 3 columns</text>

  <!-- ================= 3. Modules ================= -->
  <text x="640" y="88" fill="#0b0b0b" font-weight="600">3 · Awareness modules (small MLPs)</text>

  <!-- social module, stacked cards -->
  <rect x="656" y="134" width="210" height="112" rx="6" fill="none" stroke="#e1e0d9"/>
  <rect x="648" y="142" width="210" height="112" rx="6" fill="none" stroke="#c3c2b7"/>
  <rect x="640" y="150" width="210" height="112" rx="6" fill="#eef5fd" stroke="#2a78d6" stroke-width="1.5"/>
  <text x="745" y="170" text-anchor="middle" fill="#2a78d6" font-weight="600">Directional Social Awareness</text>
  <text x="745" y="186" text-anchor="middle" fill="#0b0b0b" font-size="11">type(i) → type(k)</text>
  <text x="745" y="206" text-anchor="middle" fill="#0b0b0b" font-size="11">MLP: 64 → 64 → |A<tspan font-size="8" dy="3">k</tspan><tspan dy="-3">|  (ReLU)</tspan></text>
  <text x="745" y="226" text-anchor="middle" fill="#52514e" font-size="11">weights shared by every (observer type,</text>
  <text x="745" y="240" text-anchor="middle" fill="#52514e" font-size="11">observed type) pair, run once per k</text>

  <!-- self module -->
  <rect x="640" y="282" width="210" height="74" rx="6" fill="#fff3ee" stroke="#eb6834" stroke-width="1.5"/>
  <text x="745" y="302" text-anchor="middle" fill="#eb6834" font-weight="600">Directional Self Awareness</text>
  <text x="745" y="318" text-anchor="middle" fill="#0b0b0b" font-size="11">type(i) only · same MLP shape</text>
  <text x="745" y="338" text-anchor="middle" fill="#52514e" font-size="11">predicts the observer's own last action</text>

  <!-- bundle -> module arrows -->
  <line x1="590" y1="202" x2="638" y2="202" stroke="#2a78d6" stroke-width="1.5" marker-end="url(#arB)"/>
  <line x1="590" y1="319" x2="638" y2="319" stroke="#eb6834" stroke-width="1.5" marker-end="url(#arO)"/>

  <!-- ================= 4. Output ================= -->
  <text x="890" y="88" fill="#0b0b0b" font-weight="600">4 · Concatenate into â<tspan font-size="9" dy="3">i</tspan></text>

  <!-- vertical stack of output slots -->
  <g font-size="11" text-anchor="middle">
    <rect x="900" y="132" width="110" height="26" fill="#cde2fb" stroke="#86b6ef"/><text x="955" y="149" fill="#0b0b0b">â<tspan font-size="8" dy="3">i,1</tspan></text>
    <rect x="900" y="158" width="110" height="26" fill="#cde2fb" stroke="#86b6ef"/><text x="955" y="175" fill="#0b0b0b">â<tspan font-size="8" dy="3">i,2</tspan></text>
    <rect x="900" y="184" width="110" height="26" fill="#9ec5f4" stroke="#2a78d6" stroke-width="1.5"/><text x="955" y="201" fill="#0b0b0b" font-weight="600">â<tspan font-size="8" dy="3">i,k</tspan></text>
    <rect x="900" y="210" width="110" height="26" fill="#cde2fb" stroke="#86b6ef"/><text x="955" y="227" fill="#0b0b0b">…</text>
    <rect x="900" y="236" width="110" height="26" fill="#fde3d7" stroke="#eb6834" stroke-width="1.5"/><text x="955" y="253" fill="#0b0b0b" font-weight="600">â<tspan font-size="8" dy="3">i,i</tspan><tspan dy="-3"> (self)</tspan></text>
    <rect x="900" y="262" width="110" height="26" fill="#cde2fb" stroke="#86b6ef"/><text x="955" y="279" fill="#0b0b0b">â<tspan font-size="8" dy="3">i,N</tspan></text>
  </g>
  <!-- bracket -->
  <path d="M1022,132 L1030,132 L1030,288 L1022,288" fill="none" stroke="#0b0b0b" stroke-width="1.5"/>
  <text x="1040" y="200" fill="#0b0b0b" font-size="12">â<tspan font-size="9" dy="3">i</tspan><tspan dy="-3"> ∈ ℝ</tspan><tspan font-size="9" dy="-6">Σ<tspan font-size="7" dy="2">k</tspan><tspan dy="-2">|A</tspan><tspan font-size="7" dy="2">k</tspan><tspan dy="-2">|</tspan></tspan></text>
  <text x="1040" y="218" fill="#52514e" font-size="11">each slot ≈ onehot(a<tspan font-size="8" dy="3">k</tspan><tspan dy="-3">)</tspan></text>
  <text x="1040" y="234" fill="#52514e" font-size="11">in a fixed agent order</text>

  <!-- module -> slot arrows -->
  <line x1="850" y1="202" x2="898" y2="197" stroke="#2a78d6" stroke-width="1.5" marker-end="url(#arB)"/>
  <path d="M850,319 C880,319 880,249 898,249" fill="none" stroke="#eb6834" stroke-width="1.5" marker-end="url(#arO)"/>

  <!-- output -> actor -->
  <path d="M955,290 L955,332 L998,332" fill="none" stroke="#52514e" stroke-width="1.5" marker-end="url(#ar)"/>
  <rect x="1000" y="312" width="150" height="40" rx="6" fill="#ffffff" stroke="#52514e"/>
  <text x="1075" y="328" text-anchor="middle" fill="#0b0b0b" font-weight="600">Actor μ<tspan font-size="8" dy="3">i</tspan><tspan dy="-3">( o</tspan><tspan font-size="8" dy="3">i</tspan><tspan dy="-3"> , â</tspan><tspan font-size="8" dy="3">i</tspan><tspan dy="-3"> )</tspan></text>
  <text x="1075" y="344" text-anchor="middle" fill="#52514e" font-size="10">AI_Net is frozen during MADDPG</text>
  <text x="946" y="352" text-anchor="end" fill="#52514e" font-size="11">extra actor input</text>

  <!-- ================= footer panel ================= -->
  <line x1="30" y1="396" x2="1150" y2="396" stroke="#e1e0d9"/>

  <text x="40" y="420" fill="#0b0b0b" font-weight="600">Pre-training (Algorithm 2)</text>
  <text x="40" y="438" fill="#52514e" font-size="11">Roll out random actions. After every step, for each pair (i, k):</text>
  <text x="40" y="454" fill="#52514e" font-size="11">loss = MSE( onehot(a<tspan font-size="8" dy="3">k</tspan><tspan dy="-3">), module(bundle) ). Modules train independently; nothing else learns.</tspan></text>
  <text x="40" y="470" fill="#52514e" font-size="11">With both frames and their difference as input, each module solves a small</text>
  <text x="40" y="486" fill="#52514e" font-size="11">inverse-dynamics problem: which action explains this change?</text>

  <text x="40" y="514" fill="#0b0b0b" font-weight="600">Why modules instead of one big net per agent</text>
  <text x="40" y="532" fill="#52514e" font-size="11">Naive: N predictors × (N·|A|) outputs = O(N²) outputs, growing with every agent.</text>
  <text x="40" y="548" fill="#52514e" font-size="11">AI_Net: one module per agent-type pair, reused for every agent of that type.</text>
  <text x="40" y="564" fill="#52514e" font-size="11">Adding agents adds forward passes, not parameters.</text>

  <!-- concrete numbers for simple_tag -->
  <text x="640" y="420" fill="#0b0b0b" font-weight="600">Instantiated for simple_tag_v3 (Action_Inference.py)</text>
  <g font-size="11" fill="#0b0b0b">
    <text x="640" y="440" fill="#52514e">agent types</text><text x="800" y="440">predator (0), prey (1)</text>
    <text x="640" y="456" fill="#52514e">slice sizes</text><text x="800" y="456">pred→pred 2 · pred→prey 4 · prey→pred 2</text>
    <text x="640" y="472" fill="#52514e">self + global</text><text x="800" y="472">8 (own vel 2, own pos 2, 2 landmarks × 2)</text>
    <text x="640" y="488" fill="#52514e">module inputs</text><text x="800" y="488">social 30 or 36 · self 24</text>
    <text x="640" y="504" fill="#52514e">module output</text><text x="800" y="504">|A| = 5 per slot (no-op, left, right, down, up)</text>
    <text x="640" y="520" fill="#52514e">modules trained</text><text x="800" y="520">3 social (pred→pred, pred→prey, prey→pred) + 2 self</text>
    <text x="640" y="536" fill="#52514e">â<tspan font-size="8" dy="3">i</tspan><tspan dy="-3"> length</tspan></text><text x="800" y="536">4 agents × 5 = 20</text>
  </g>

  <text x="590" y="600" text-anchor="middle" fill="#898781" font-size="11">Only the agent-k and self rows are drawn with arrows; every other row is routed the same way to its own social-module instance.</text>
</svg>
